name: 'Lock branch'
author: 'Pete Sramek'
description: 'Restore ruleset protection for a branch previously unlocked by the unlock action (removes it from each ruleset exclude list).'
inputs:
  branch:
    description: 'Branch name to lock.'
    required: true
  token:
    description: 'GitHub token with administration:write (repo admin) permission. Use a PAT; GITHUB_TOKEN cannot modify rulesets.'
    required: true
  ruleset-ids:
    description: 'Space-separated ruleset IDs, as output by the unlock action.'
    required: true

runs:
  using: composite
  steps:
    - name: 'Lock branch ${{ inputs.branch }}'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        REPOSITORY: ${{ github.repository }}
        RULESET_IDS: ${{ inputs.ruleset-ids }}
      run: |
        ref="refs/heads/$BRANCH"
        failed=0
        for id in $RULESET_IDS; do
          endpoint="/repos/$REPOSITORY/rulesets/$id"
          if ! gh api "$endpoint" \
            | jq -c --arg ref "$ref" '{conditions: (.conditions | .ref_name.exclude -= [$ref])}' \
            | gh api --method PUT "$endpoint" --input - > /dev/null; then
            echo "::error::Failed to restore ruleset $id for '$BRANCH'."
            failed=1
          fi
        done
        [ "$failed" = 0 ] || exit 1
        echo "🔒 Branch '$BRANCH' is protected again." >> $GITHUB_STEP_SUMMARY
