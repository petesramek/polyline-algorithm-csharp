version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "petesramek"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "petesramek"
    ignore:
      # Ignore dependency as we don't want to force user to use specific versions. We need 6+ to support features we use.
      # Only upper limit applies to run test once new major version is available.
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        versions: [">= 6.0.0, < 12.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "petesramek"
